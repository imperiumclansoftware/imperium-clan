# Recommandé : servir Angular et l'API sur le même site (pas de CORS nécessaire).
# Sinon : liste blanche d'origines par environnement, jamais '*' avec credentials.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_credentials: true
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'X-XSRF-TOKEN']
        max_age: 3600
    paths:
        '^/api/': null
