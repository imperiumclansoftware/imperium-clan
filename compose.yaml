# Environnement local : PostgreSQL uniquement. Les mots de passe ci-dessous sont factices (dev).
name: imperium-clan
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: '!ChangeMe!'
    ports: ['127.0.0.1:5435:5432']
    volumes: ['db-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', 'app', '-U', 'app']
      interval: 2s
      retries: 30
volumes:
  db-data:
