name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: sodium, intl, pdo_sqlite }
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --no-progress
      - run: php bin/console lint:container
      - run: php bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: returntocorp/semgrep-action@v1
        with: { config: 'p/php p/typescript p/owasp-top-ten' }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: 'imperium-clan:ci', cache-from: type=gha, cache-to: 'type=gha,mode=max' }
      # Démarrage réel, puis une commande lancée par « docker exec » (sans passer par l'entrypoint) doit
      # trouver la base SQLite et le secret générés au démarrage.
      - name: Smoke test
        run: |
          docker run -d --name portail imperium-clan:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' portail)" = healthy ] && break
            sleep 2
          done
          docker exec portail php bin/console dbal:run-sql 'SELECT COUNT(*) FROM tool'
          docker exec portail php bin/console debug:dotenv APP_SECRET | grep -q '✓ .env.prod.local'
          docker logs portail 2>&1 | grep -q 'Jeton d'
